server {
    listen 80;

    # 靜態首頁 (展示頁面)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理轉發至 Python 後端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}