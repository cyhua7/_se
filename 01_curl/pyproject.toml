[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mycurl"
version = "0.1.0"
description = "A curl-like HTTP client tool written in Python"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.scripts]
mycurl = "mycurl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycurl*"]
